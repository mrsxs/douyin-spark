name: CI & Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 测试 & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（规则集钉在 ruff.toml，不随 ruff 版本漂移）
        run: ruff check app/ tests/ run.py

      - name: 测试
        run: pytest -q
        env:
          # 测试用临时 DB，SKIP_LICENSE_CHECK 只在源码态有效
          SKIP_LICENSE_CHECK: '1'

      - name: Summary
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 有失败，已阻止镜像构建" >> $GITHUB_STEP_SUMMARY
          fi

  build-push:
    name: 构建并推送镜像
    needs: test                                   # 测试不过就不推镜像
    if: github.event_name != 'pull_request'       # PR 只跑测试，不推
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.DOCKERHUB_USERNAME && format('{0}/douyin-spark', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像自检（能起来 + License 后门确实关闭）
        run: |
          set -e
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "自检镜像: $IMG"

          # ① 无 LICENSE_KEY 且带 SKIP_LICENSE_CHECK=1 必须拒绝启动。
          #    能起来说明 Dockerfile 里的 sed 没生效，后门还在 —— 直接失败。
          if docker run --rm -e SKIP_LICENSE_CHECK=1 "$IMG" \
               python -c "from app.license import license_gate; license_gate()" 2>/dev/null; then
            echo "::error::SKIP_LICENSE_CHECK 后门仍然有效，镜像可被白嫖"
            exit 1
          fi
          echo "✓ License 后门已关闭"

          # ② 关键模块确实编译成了 .so
          docker run --rm "$IMG" sh -c '
            test -f app/license.cpython-*.so || { echo "license 未编译"; exit 1; }
            test -f douyin_im.cpython-*.so   || { echo "douyin_im 未编译"; exit 1; }
          '
          echo "✓ 核心模块已编译"

          # ③ 编译完还得能跑。
          #    只测「编译成功」是不够的：Cython 默认把 PEP-484 注解当运行时类型声明，
          #    FastAPI 的 `username: str = Form(...)` 会在模块 init 时抛
          #    `TypeError: Expected str, got Form`，router 一个都 import 不进来。
          #    这个镜像照样能通过 ①②，然后在客户机器上崩溃循环 —— 真发生过。
          docker run --rm -e SKIP_LICENSE_CHECK=1 -e SECRET_KEY=ci-selfcheck \
            -e DATA_DIR=/tmp/selfcheck "$IMG" python -c "
from app import license as lic
lic._LICENSE_OK = True
from app.routers import auth, dashboard, api, admin, login_flow, ai
import app.main as m
app = m.app
print('routes:', len(app.routes))
"
          echo "✓ 应用可正常加载（router 全部 import 成功）"

          # ④ 真起一个容器，打一次 /healthz。
          #    上面是 import 级别的检查，这里确认进程能活着对外服务。
          CID=$(docker run -d -e SKIP_LICENSE_CHECK=1 -e SECRET_KEY=ci-selfcheck \
                  -p 18765:8765 "$IMG")
          for i in $(seq 1 30); do
            if curl -sf -m 3 http://127.0.0.1:18765/healthz >/dev/null 2>&1; then
              echo "✓ 容器启动正常，/healthz 可访问"
              docker rm -f "$CID" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::容器起来了但 /healthz 一直不通"
          docker logs --tail 40 "$CID"
          docker rm -f "$CID" >/dev/null
          exit 1

      - name: Summary
        run: |
          echo "## ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**推送的镜像 tag：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${{ vars.DOCKERHUB_USERNAME }}" ]]; then
            echo "### Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ vars.DOCKERHUB_USERNAME }}/douyin-spark:latest" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Docker Hub 未配置" >> $GITHUB_STEP_SUMMARY
            echo "要自动推 Docker Hub，在 repo Settings → Secrets and variables → Actions：" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Variables** 加 \`DOCKERHUB_USERNAME\`（Docker Hub 用户名）" >> $GITHUB_STEP_SUMMARY
            echo "- **Secrets** 加 \`DOCKERHUB_TOKEN\`（hub.docker.com → Account Settings → Security → New Access Token）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GHCR（GitHub 自带，已推）" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
