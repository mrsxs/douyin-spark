name: CI & Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 测试 & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（规则集钉在 ruff.toml，不随 ruff 版本漂移）
        run: ruff check app/ tests/ run.py

      - name: 测试
        run: pytest -q

      - name: Summary
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 有失败，已阻止镜像构建" >> $GITHUB_STEP_SUMMARY
          fi

  build-push:
    name: 构建并推送镜像
    needs: test                                   # 测试不过就不推镜像
    if: github.event_name != 'pull_request'       # PR 只跑测试，不推
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.DOCKERHUB_USERNAME && format('{0}/douyin-spark', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像自检（起得来 + 路由能 import）
        run: |
          set -e
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "自检镜像: $IMG"

          # 建出 app、挂上全部路由、起一次 uvicorn 打 /healthz。
          # 只测「镜像能 docker run」是不够的：路由 import 失败照样能进 shell，
          # 然后在用户机器上崩溃循环。脚本单独放 tools/ 而不是内联 ——
          # 内联的多行 python 会破坏 run: | 的 YAML 缩进（踩过）。
          docker run --rm -e SECRET_KEY=ci-selfcheck -e DATA_DIR=/tmp/selfcheck \
            -v "$PWD/tools/image_selfcheck.py:/tmp/image_selfcheck.py:ro" \
            "$IMG" python /tmp/image_selfcheck.py

      - name: Summary
        run: |
          echo "## ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**推送的镜像 tag：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${{ vars.DOCKERHUB_USERNAME }}" ]]; then
            echo "### Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ vars.DOCKERHUB_USERNAME }}/douyin-spark:latest" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Docker Hub 未配置" >> $GITHUB_STEP_SUMMARY
            echo "要自动推 Docker Hub，在 repo Settings → Secrets and variables → Actions：" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Variables** 加 \`DOCKERHUB_USERNAME\`（Docker Hub 用户名）" >> $GITHUB_STEP_SUMMARY
            echo "- **Secrets** 加 \`DOCKERHUB_TOKEN\`（hub.docker.com → Account Settings → Security → New Access Token）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GHCR（GitHub 自带，已推）" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
