{% extends "base.html" %}
{% block title %}登录 · {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 space-y-4">
  <div class="card p-8">
    <h1 class="text-2xl font-bold text-center mb-6">登录</h1>
    {% if error %}
    <div class="mb-4 p-3 bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 rounded-lg text-sm text-rose-700 dark:text-rose-400">
      {% if error == "rate_limited" %}尝试过于频繁，请稍等一分钟再试
      {% else %}用户名或密码错误{% endif %}
    </div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="label">用户名</label>
        <input name="username" class="input" autofocus required autocomplete="username" />
      </div>
      <div>
        <label class="label">密码</label>
        <input type="password" name="password" class="input" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary w-full justify-center">登录</button>
    </form>
    <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      {% if allow_register() %}还没账号？<a href="/register" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">注册</a>
      {% else %}本站未开放注册，请联系管理员开通账号{% endif %}
    </div>
  </div>
</div>
{% endblock %}
