services:
  app:
    # Docker Hub 公开镜像，pull 不需要登录。
    # GHCR（ghcr.io/mrsxs/douyin-spark）默认是私有包，匿名 pull 会 403 ——
    # 要用它得先把 package visibility 改成 public，或 `docker login ghcr.io`。
    # 想自己构建就把 image 换成 `build: .`
    image: mrsxs/douyin-spark:latest
    container_name: douyin-spark
    # 固定 DNS 避免系统 DNS 瞬断导致 imapi.douyin.com 解析失败
    dns:
      - 223.5.5.5        # 阿里 DNS（国内首选）
      - 114.114.114.114  # 114 DNS（备用）
      - 8.8.8.8          # Google（海外备用）
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # ─── 时区（⭐ 关键：不设的话容器走 UTC，定时时间会差 8 小时）──
      TZ: "${TZ:-Asia/Shanghai}"

      # ─── 注册开关（默认关；开放注册前先想清楚面板是不是对公网可见）──
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"

      # ─── 管理员（留空则容器首次启动自动生成强随机密码并打印一次）──
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # ADMIN_PASSWORD_HASH: "$2b$12$..."   # 显式指定 bcrypt 哈希可覆盖首次自动生成

      # ─── 可选：Session / Cookie ─────────────────
      SECRET_KEY: "${SECRET_KEY:-}"         # 留空自动持久化到 /data/.secret_key
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"      # 生产 HTTPS 环境改 true
      SESSION_MAX_AGE: "${SESSION_MAX_AGE:-2592000}"  # 30 天

      # ─── 数据 ────────────────────────────────
      DATA_DIR: /data
      DB_URL: "${DB_URL:-}"                  # 留空 → sqlite:///./data/app.db
      SITE_NAME: "${SITE_NAME:-续火花}"

      # ─── 抖音签名基建 ────────────────────────
      DOUYIN_CAPTCHA_URL: "${DOUYIN_CAPTCHA_URL:-}"
      DOUYIN_CAPTCHA_ENDPOINT: "${DOUYIN_CAPTCHA_ENDPOINT:-/slide_match}"
      DOUYIN_CAPTCHA_KEY: "${DOUYIN_CAPTCHA_KEY:-}"

      # ─── 可选：邮件 SMTP（也可以在 /admin/smtp 后台配）────
      # SMTP_HOST: ""
      # SMTP_PORT: "587"
      # SMTP_USER: ""
      # SMTP_PASSWORD: ""
      # SMTP_FROM: ""
      # SMTP_TLS: "true"

    # ⭐ 数据持久化用 bind mount（直接挂宿主机目录，客户能看到 / 手动备份容易）
    # 默认 ./data（compose 文件所在目录）；.env 里 DATA_VOLUME_PATH=X 可自定义
    # 例如：DATA_VOLUME_PATH=D:/MyData/spark 或 DATA_VOLUME_PATH=/mnt/external/spark
    # 删除容器都不会删此目录；备份此目录 = 备份所有 cookies/DB/日志/密钥
    volumes:
      - ${DATA_VOLUME_PATH:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
