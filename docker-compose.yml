services:
  app:
    # Docker Hub 公开镜像，pull 不需要登录
    # 如果想用 GHCR 私有：先 `docker login ghcr.io`，然后改成 ghcr.io/mrsxs/douyin-spark:latest
    image: mrsxs/douyin-spark:latest
    container_name: douyin-spark
    # 固定容器 MAC：保证机器码（基于 MAC 派生）跨重建稳定
    # LICENSE_STRICT=1 模式必备，否则 down/up 后机器码变化会让绑机器 license 失效
    mac_address: "02:42:ac:de:ad:01"
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # ─── 必填 ──────────────────────────────────
      LICENSE_KEY: "${LICENSE_KEY:?LICENSE_KEY is required，联系卖家（闲鱼 HU287）获取}"

      # ─── 可选：管理员（留空则容器首次启动自动生成并打印一次）──
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # ADMIN_PASSWORD_HASH: "$2b$12$..."   # 显式指定 bcrypt 哈希可覆盖首次自动生成

      # ─── 可选：Session / Cookie ─────────────────
      SECRET_KEY: "${SECRET_KEY:-}"         # 留空自动持久化到 /data/.secret_key
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"      # 生产 HTTPS 环境改 true
      SESSION_MAX_AGE: "${SESSION_MAX_AGE:-2592000}"  # 30 天

      # ─── 数据 ────────────────────────────────
      DATA_DIR: /data
      DB_URL: "${DB_URL:-}"                  # 留空 → sqlite:///./data/app.db
      SITE_NAME: "${SITE_NAME:-续火花}"

      # ─── 抖音签名基建 ────────────────────────
      DOUYIN_CAPTCHA_URL: "${DOUYIN_CAPTCHA_URL:-http://ocr.example.com}"
      DOUYIN_CAPTCHA_ENDPOINT: "${DOUYIN_CAPTCHA_ENDPOINT:-/slide_match}"
      DOUYIN_CAPTCHA_KEY: "${DOUYIN_CAPTCHA_KEY:-}"

      # ─── License 严格模式（绑机器，可选）────
      # LICENSE_STRICT: "1"

      # ─── 可选：邮件 SMTP（也可以在 /admin/smtp 后台配）────
      # SMTP_HOST: ""
      # SMTP_PORT: "587"
      # SMTP_USER: ""
      # SMTP_PASSWORD: ""
      # SMTP_FROM: ""
      # SMTP_TLS: "true"
    volumes:
      # 持久化：cookies / 模板 / SQLite DB / 日志 / 加密密钥
      - spark-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  spark-data:
    driver: local
